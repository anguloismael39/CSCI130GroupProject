<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Register – Wordle | CSci 130</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header">
  <p class="brand">Wordle</p>
  <nav aria-label="Main navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="rules.html">Rules</a></li>
      <li><a href="game.html">Play</a></li>
      <li><a href="leaderboard.html">Leaderboard</a></li>
      <li><a href="creator.html">Creator</a></li>
      <li id="auth-nav"><a href="login.html" aria-current="page">Login / Register</a></li>
    </ul>
  </nav>
</header>
<main id="main">
<h1>Login or Register</h1>
<p id="auth-state" role="status"></p>
<div class="forms" id="forms">
  <section aria-labelledby="login-title">
    <h2 id="login-title">Login</h2>
    <form id="login-form" novalidate>
      <label for="login-username">Username</label>
      <input id="login-username" name="username" type="text" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <p class="form-message" role="alert"></p>
    </form>
  </section>
  <section aria-labelledby="register-title">
    <h2 id="register-title">Register</h2>
    <form id="register-form" novalidate>
      <label for="reg-username">Username</label>
      <input id="reg-username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" aria-describedby="reg-username-hint">
      <p id="reg-username-hint" class="hint">3–20 letters, digits or underscores.</p>
      <label for="reg-password">Password</label>
      <input id="reg-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72" aria-describedby="reg-password-hint">
      <p id="reg-password-hint" class="hint">8–72 characters.</p>
      <button type="submit">Create account</button>
      <p class="form-message" role="alert"></p>
    </form>
  </section>
</div>
</main>
<footer class="site-footer">
  <p>CSci 130 Web Programming – Fall 2026 · Wordle group project</p>
</footer>
<script src="js/wordle-logic.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
